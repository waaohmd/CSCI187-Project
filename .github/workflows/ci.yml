name: Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }} / Node.js 24
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json
          coverage: none

      - name: Check JavaScript, project structure, and unit tests
        run: npm run check

      - name: Check PHP syntax
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run API integration tests
        shell: bash
        run: |
          php -S 127.0.0.1:8080 -t . > "$RUNNER_TEMP/php-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=false
          for attempt in {1..20}; do
            if curl --fail --silent 'http://127.0.0.1:8080/api.php?resource=listings' > /dev/null; then
              ready=true
              break
            fi
            sleep 0.25
          done

          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/php-server.log"
            exit 1
          fi

          npm run test:api

